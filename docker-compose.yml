version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: caremate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caremate_admin
      POSTGRES_PASSWORD: caremate_secure_pass
      POSTGRES_DB: caremate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caremate_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caremate_admin -d caremate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caremate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - caremate_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caremate_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://caremate_admin:caremate_secure_pass@postgres:5432/caremate_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secure_jwt_access_secret_key_caremate_2026
      JWT_REFRESH_SECRET: super_secure_jwt_refresh_secret_key_caremate_2026
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - caremate_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: caremate_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - caremate_network

volumes:
  postgres_data:
  redis_data:

networks:
  caremate_network:
    driver: bridge
